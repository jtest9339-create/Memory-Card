<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Journal</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Journal">

  <!-- Google Fonts: Inter for clean typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Leaflet.js for Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: { 
            nordic: { 50: '#fafaf9', 100: '#f5f5f4', 200: '#e7e5e4', 300: '#d6d3d1', 800: '#292524', 900: '#1c1917' }
          }
        }
      }
    }
  </script>

  <style>
    body { background-color: #fafaf9; color: #292524; -webkit-tap-highlight-color: transparent; }
    .aspect-4-3 { aspect-ratio: 4 / 3; }
    canvas { touch-action: none; -webkit-user-select: none; user-select: none; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 9999px; }
    ::-webkit-scrollbar-track { background: transparent; }
    @media all and (display-mode: standalone) {
      header { padding-top: env(safe-area-inset-top); }
    }
    .glass-pill { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased selection:bg-nordic-200">

  <header class="bg-nordic-50/90 backdrop-blur-md sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-5 h-20 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-full bg-nordic-900 text-white flex items-center justify-center text-lg shadow-sm">
          <i class="fa-solid fa-leaf"></i>
        </div>
        <h1 class="font-semibold text-xl tracking-tight">Journal</h1>
      </div>
      <div class="flex items-center space-x-3">
        <button id="btn-open-sync" class="w-10 h-10 rounded-full hover:bg-nordic-200 text-nordic-800 transition flex items-center justify-center" title="Settings">
          <i class="fa-solid fa-gear"></i>
        </button>
        <button id="btn-new-entry" class="bg-nordic-900 hover:bg-nordic-800 text-white text-sm font-medium px-5 py-2.5 rounded-full flex items-center space-x-2 shadow-sm transition active:scale-95">
          <i class="fa-solid fa-plus"></i><span class="hidden sm:inline">New</span>
        </button>
      </div>
    </div>
    
    <div class="max-w-5xl mx-auto px-5 flex space-x-6 overflow-x-auto text-sm no-scrollbar border-b border-nordic-200">
      <button data-tab="single" class="tab-btn pb-3 font-medium border-b-2 border-nordic-900 text-nordic-900 flex items-center space-x-2 whitespace-nowrap transition"><i class="fa-solid fa-book-open"></i><span>Diary</span></button>
      <button data-tab="weekly" class="tab-btn pb-3 font-medium border-b-2 border-transparent text-nordic-300 hover:text-nordic-800 flex items-center space-x-2 whitespace-nowrap transition"><i class="fa-solid fa-border-all"></i><span>Weekly</span></button>
      <button data-tab="on-this-day" class="tab-btn pb-3 font-medium border-b-2 border-transparent text-nordic-300 hover:text-nordic-800 flex items-center space-x-2 whitespace-nowrap transition"><i class="fa-solid fa-clock-rotate-left"></i><span>Timeline</span></button>
      <button data-tab="filter" class="tab-btn pb-3 font-medium border-b-2 border-transparent text-nordic-300 hover:text-nordic-800 flex items-center space-x-2 whitespace-nowrap transition"><i class="fa-solid fa-magnifying-glass"></i><span>Search</span></button>
      <button data-tab="mood-chart" class="tab-btn pb-3 font-medium border-b-2 border-transparent text-nordic-300 hover:text-nordic-800 flex items-center space-x-2 whitespace-nowrap transition"><i class="fa-solid fa-chart-simple"></i><span>Mood</span></button>
      <button data-tab="map" class="tab-btn pb-3 font-medium border-b-2 border-transparent text-nordic-300 hover:text-nordic-800 flex items-center space-x-2 whitespace-nowrap transition"><i class="fa-solid fa-map-pin"></i><span>Map</span></button>
    </div>
  </header>

  <main class="flex-1 max-w-5xl w-full mx-auto p-5 sm:p-8 space-y-8">
    
    <!-- GALLERY VIEW -->
    <section id="view-single" class="tab-content"><div id="single-card-container" class="max-w-lg mx-auto"></div></section>
    
    <!-- WEEKLY VIEW -->
    <section id="view-weekly" class="tab-content hidden space-y-6">
      <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
        <div class="flex items-center space-x-4 bg-white px-2 py-1.5 rounded-full shadow-sm border border-nordic-100">
          <button id="btn-prev-week" class="w-8 h-8 rounded-full hover:bg-nordic-100 text-nordic-800 flex items-center justify-center transition"><i class="fa-solid fa-chevron-left"></i></button>
          <span id="weekly-range-label" class="font-medium text-nordic-800 text-sm w-32 text-center"></span>
          <button id="btn-next-week" class="w-8 h-8 rounded-full hover:bg-nordic-100 text-nordic-800 flex items-center justify-center transition"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
        <button id="btn-today-week" class="text-xs text-nordic-800 hover:bg-nordic-200 px-4 py-2 rounded-full font-medium transition">Today</button>
      </div>
      <div id="weekly-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6"></div>
    </section>

    <!-- TIMELINE VIEW -->
    <section id="view-on-this-day" class="tab-content hidden space-y-8">
      <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
        <h2 id="on-this-day-title" class="text-2xl font-light tracking-tight text-nordic-900">Memories</h2>
        <input type="date" id="input-on-this-day-date" class="bg-white text-nordic-800 text-sm rounded-full px-4 py-2 border border-nordic-200 outline-none focus:ring-2 focus:ring-nordic-800 transition">
      </div>
      <div id="on-this-day-container" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
    </section>

    <!-- SEARCH VIEW -->
    <section id="view-filter" class="tab-content hidden space-y-8">
      <div class="space-y-4">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-5 top-1/2 -translate-y-1/2 text-nordic-300"></i>
          <input type="text" id="search-input" placeholder="Search entries, tags, locations..." class="w-full pl-12 pr-5 py-4 rounded-3xl bg-white shadow-sm border-transparent focus:border-nordic-300 focus:ring-0 text-sm outline-none transition">
        </div>
        <div class="flex flex-wrap items-center gap-2" id="mood-filter-chips"></div>
      </div>
      <div id="filter-results-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
    </section>

    <!-- STATS VIEW -->
    <section id="view-mood-chart" class="tab-content hidden space-y-8">
      <div class="flex items-center justify-between">
        <h2 class="text-2xl font-light tracking-tight text-nordic-900">Analytics</h2>
        <div class="flex bg-nordic-200/50 p-1 rounded-full text-xs font-medium text-nordic-800">
          <button id="chart-range-7" class="chart-range-btn px-4 py-1.5 rounded-full bg-white shadow-sm transition" onclick="setChartRange(7)">7D</button>
          <button id="chart-range-30" class="chart-range-btn px-4 py-1.5 rounded-full hover:bg-white/50 transition" onclick="setChartRange(30)">30D</button>
          <button id="chart-range-all" class="chart-range-btn px-4 py-1.5 rounded-full hover:bg-white/50 transition" onclick="setChartRange(0)">All</button>
        </div>
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
        <div class="bg-white p-5 rounded-3xl shadow-sm border border-nordic-100 flex flex-col items-center justify-center text-center"><p class="text-xs text-nordic-300 uppercase tracking-widest mb-2">Avg Mood</p><p id="stat-avg-score" class="text-3xl font-light text-nordic-900">--</p></div>
        <div class="bg-white p-5 rounded-3xl shadow-sm border border-nordic-100 flex flex-col items-center justify-center text-center"><p class="text-xs text-nordic-300 uppercase tracking-widest mb-2">Top Mood</p><p id="stat-top-mood" class="text-3xl font-light text-nordic-900">--</p></div>
        <div class="bg-white p-5 rounded-3xl shadow-sm border border-nordic-100 flex flex-col items-center justify-center text-center"><p class="text-xs text-nordic-300 uppercase tracking-widest mb-2">Happy</p><p id="stat-happy-rate" class="text-3xl font-light text-nordic-900">--%</p></div>
        <div class="bg-white p-5 rounded-3xl shadow-sm border border-nordic-100 flex flex-col items-center justify-center text-center"><p class="text-xs text-nordic-300 uppercase tracking-widest mb-2">Entries</p><p id="stat-total-entries" class="text-3xl font-light text-nordic-900">0</p></div>
      </div>
      <div class="bg-white p-6 rounded-3xl shadow-sm border border-nordic-100"><div class="w-full h-64 relative"><canvas id="moodTrendChart"></canvas></div></div>
    </section>

    <!-- MAP VIEW -->
    <section id="view-map" class="tab-content hidden space-y-6">
      <div class="flex items-center justify-between">
        <h2 class="text-2xl font-light tracking-tight text-nordic-900">Places</h2>
      </div>
      <div class="bg-white p-2 rounded-3xl shadow-sm border border-nordic-100">
        <div id="map-container" class="w-full h-[65vh] rounded-2xl z-10"></div>
      </div>
    </section>
  </main>

  <!-- DIARY EDITOR MODAL -->
  <div id="editor-modal" class="fixed inset-0 bg-nordic-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-0 sm:p-5 overflow-y-auto">
    <div class="bg-nordic-50 sm:rounded-[2rem] w-full h-full sm:h-auto max-w-3xl sm:max-h-[90vh] flex flex-col shadow-2xl overflow-hidden relative">
      
      <!-- Top Action Bar (Floating Over Canvas) -->
      <div class="px-5 py-4 flex items-center justify-between bg-nordic-50 z-10 border-b border-nordic-200/50">
        <div class="flex space-x-3 items-center">
          <button id="btn-close-editor" class="w-9 h-9 rounded-full bg-white hover:bg-nordic-100 text-nordic-800 flex items-center justify-center transition shadow-sm"><i class="fa-solid fa-xmark"></i></button>
          <span class="font-medium text-sm text-nordic-800">Editor</span>
        </div>
        <div class="flex space-x-2">
          <button id="btn-delete-entry" class="w-9 h-9 rounded-full bg-white hover:bg-red-50 text-red-500 flex items-center justify-center transition shadow-sm hidden"><i class="fa-regular fa-trash-can"></i></button>
          <button id="btn-save-editor" class="bg-nordic-900 hover:bg-nordic-800 text-white px-5 py-2 rounded-full text-sm font-medium transition shadow-sm">Save</button>
        </div>
      </div>

      <!-- Scrollable Body -->
      <div class="flex-1 overflow-y-auto p-5 sm:p-8 space-y-8">
        
        <!-- Minimal Meta Inputs -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div class="space-y-1.5"><div class="flex justify-between items-end h-4"><label class="text-[10px] uppercase tracking-widest text-nordic-300 font-semibold pl-1 leading-none">Date</label></div><input type="date" id="edit-date" class="w-full bg-white border border-nordic-200 rounded-2xl px-4 py-3 text-sm outline-none focus:border-nordic-800 transition"></div>
          <div class="space-y-1.5"><div class="flex justify-between items-end h-4"><label class="text-[10px] uppercase tracking-widest text-nordic-300 font-semibold pl-1 leading-none">Mood</label></div><select id="edit-mood" class="w-full bg-white border border-nordic-200 rounded-2xl px-4 py-3 text-sm outline-none focus:border-nordic-800 transition appearance-none"><option value="5">😄 5</option><option value="4">😊 4</option><option value="3">😐 3</option><option value="2">🙁 2</option><option value="1">😭 1</option></select></div>
          <div class="space-y-1.5 md:col-span-2 relative"><div class="flex justify-between items-end h-4"><label class="text-[10px] uppercase tracking-widest text-nordic-300 font-semibold pl-1 leading-none">Location</label><button id="btn-detect-gps" class="text-[10px] text-nordic-800 font-medium hover:underline leading-none"><i class="fa-solid fa-location-crosshairs"></i> Get GPS</button></div><input type="text" id="edit-location" placeholder="City, Place..." class="w-full bg-white border border-nordic-200 rounded-2xl px-4 py-3 text-sm outline-none focus:border-nordic-800 transition"></div>
        </div>

        <!-- Floating Canvas Toolbox -->
        <div class="sticky top-0 z-40 flex justify-center pb-2 pointer-events-none">
          <div class="glass-pill border border-nordic-200/50 shadow-sm rounded-full p-2 flex items-center gap-1 pointer-events-auto">
            <!-- Mode -->
            <div class="flex bg-nordic-100/50 rounded-full p-1">
              <button id="tool-select" class="w-8 h-8 rounded-full text-nordic-400 hover:text-nordic-800 transition flex items-center justify-center" title="Select / Move"><i class="fa-solid fa-arrow-pointer"></i></button>
              <button id="tool-pen" class="w-8 h-8 rounded-full bg-white shadow-sm text-nordic-900 transition flex items-center justify-center" title="Draw"><i class="fa-solid fa-pen"></i></button>
              <button id="tool-eraser" class="w-8 h-8 rounded-full text-nordic-400 hover:text-nordic-800 transition flex items-center justify-center" title="Eraser"><i class="fa-solid fa-eraser"></i></button>
            </div>
            <div class="w-px h-5 bg-nordic-200 mx-1"></div>
            <!-- Brushes -->
            <input type="color" id="pen-color-picker" value="#292524" class="w-7 h-7 rounded-full cursor-pointer border-0 bg-transparent p-0" title="Color">
            <input type="range" id="pen-size" min="2" max="24" value="4" class="w-16 accent-nordic-800 mx-2">
            <div class="w-px h-5 bg-nordic-200 mx-1"></div>
            <!-- Insert -->
            <button id="tool-add-text" class="w-8 h-8 rounded-full hover:bg-nordic-100 text-nordic-600 transition flex items-center justify-center" title="Add Text"><i class="fa-solid fa-t"></i></button>
            <label class="w-8 h-8 rounded-full hover:bg-nordic-100 text-nordic-600 transition flex items-center justify-center cursor-pointer mb-0" title="Add Sticker"><i class="fa-regular fa-image"></i><input type="file" id="input-overlay-img" accept="image/*" class="hidden"></label>
            <div class="w-px h-5 bg-nordic-200 mx-1"></div>
            <!-- History -->
            <button id="btn-undo" class="w-8 h-8 rounded-full hover:bg-nordic-100 text-nordic-600 disabled:opacity-30 transition flex items-center justify-center"><i class="fa-solid fa-rotate-left"></i></button>
            <button id="btn-redo" class="w-8 h-8 rounded-full hover:bg-nordic-100 text-nordic-600 disabled:opacity-30 transition flex items-center justify-center"><i class="fa-solid fa-rotate-right"></i></button>
          </div>
        </div>

        <!-- 4:3 Canvas Area -->
        <div class="relative bg-white rounded-3xl p-2 sm:p-4 shadow-sm border border-nordic-200 group">
          <!-- Quick Background Actions -->
          <div class="absolute -top-4 right-4 flex space-x-2 z-30 opacity-0 group-hover:opacity-100 transition duration-300">
            <label class="glass-pill text-xs px-3 py-1.5 rounded-full cursor-pointer shadow-sm text-nordic-600 hover:text-nordic-900 border border-nordic-100"><i class="fa-regular fa-image mr-1"></i>Set BG<input type="file" id="input-photo" accept="image/*" class="hidden"></label>
            <button id="btn-remove-bg" class="glass-pill text-xs px-3 py-1.5 rounded-full shadow-sm text-nordic-600 hover:text-nordic-900 border border-nordic-100"><i class="fa-solid fa-xmark mr-1"></i>BG</button>
            <button id="btn-clear-canvas" class="glass-pill text-xs px-3 py-1.5 rounded-full shadow-sm text-red-500 hover:text-red-700 border border-nordic-100"><i class="fa-solid fa-trash-can mr-1"></i>Ink</button>
          </div>

          <div id="canvas-frame" class="w-full aspect-4-3 bg-nordic-50 rounded-2xl relative overflow-hidden flex items-center justify-center touch-none">
            <img id="canvas-bg-img" class="absolute inset-0 w-full h-full object-cover hidden pointer-events-none z-0">
            <div id="overlay-container" class="absolute inset-0 z-10 pointer-events-none"></div>
            <canvas id="editor-canvas" width="800" height="600" class="absolute inset-0 w-full h-full cursor-crosshair z-20"></canvas>
            
            <div id="sticker-toolbar" class="hidden absolute glass-pill p-1 rounded-full shadow-md flex space-x-1 z-40 text-xs transition-opacity border border-nordic-200">
              <button id="st-front" class="w-8 h-8 hover:bg-nordic-100 rounded-full text-nordic-600"><i class="fa-solid fa-arrow-up"></i></button>
              <button id="st-back" class="w-8 h-8 hover:bg-nordic-100 rounded-full text-nordic-600"><i class="fa-solid fa-arrow-down"></i></button>
              <button id="st-del" class="w-8 h-8 hover:bg-red-50 text-red-500 rounded-full"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
        </div>

        <!-- Text Notes & Tags -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="space-y-1.5"><div class="flex justify-between items-end h-4"><label class="text-[10px] uppercase tracking-widest text-nordic-300 font-semibold pl-1 leading-none">Tags</label></div><input type="text" id="edit-tags" placeholder="#travel, #food" class="w-full bg-white border border-nordic-200 rounded-2xl px-4 py-3 text-sm outline-none focus:border-nordic-800 transition"></div>
          <div class="space-y-1.5"><div class="flex justify-between items-end h-4"><label class="text-[10px] uppercase tracking-widest text-nordic-300 font-semibold pl-1 leading-none">Notes</label></div><textarea id="edit-typed-text" rows="1" placeholder="Add some text..." class="w-full bg-white border border-nordic-200 rounded-2xl px-4 py-3 text-sm outline-none focus:border-nordic-800 transition resize-none"></textarea></div>
        </div>
      </div>
    </div>
  </div>

  <!-- SYNC MODAL -->
  <div id="sync-modal" class="fixed inset-0 bg-nordic-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-5">
    <div class="bg-white rounded-3xl max-w-sm w-full p-8 space-y-6 shadow-2xl relative">
      <button id="btn-close-sync" class="absolute top-6 right-6 text-nordic-400 hover:text-nordic-800 transition"><i class="fa-solid fa-xmark"></i></button>
      <h3 class="font-light text-2xl text-nordic-900">Settings</h3>
      <div class="space-y-4 text-sm">
        <div class="p-5 bg-nordic-50 rounded-2xl space-y-4">
          <p class="font-medium text-nordic-800">Backup & Restore</p>
          <div class="grid grid-cols-2 gap-2">
            <button id="btn-export-json" class="bg-white border border-nordic-200 hover:border-nordic-300 text-nordic-800 py-3 rounded-xl font-medium transition flex justify-center items-center gap-2 shadow-sm"><i class="fa-solid fa-upload"></i> Export</button>
            <label class="cursor-pointer bg-white border border-nordic-200 hover:border-nordic-300 text-nordic-800 py-3 rounded-xl font-medium transition flex justify-center items-center gap-2 shadow-sm"><i class="fa-solid fa-download"></i> Import<input type="file" id="input-import-json" accept=".json" class="hidden"></label>
          </div>
        </div>
        <div class="flex items-center justify-between p-4 bg-nordic-50 rounded-2xl">
          <div><p class="font-medium text-nordic-800 text-sm">Free Space</p><p class="text-xs text-nordic-400 mt-0.5">Compress old entries</p></div>
          <button id="btn-compress-images" class="bg-white border border-nordic-200 hover:bg-nordic-100 text-nordic-800 text-xs px-4 py-2 rounded-full font-medium transition shadow-sm">Compress</button>
        </div>
        <div class="flex items-center justify-between p-4 bg-red-50 rounded-2xl">
          <div><p class="font-medium text-red-900 text-sm">Erase Data</p><p class="text-xs text-red-700 mt-0.5">Delete all local data</p></div>
          <button id="btn-clear-all" class="bg-red-500 hover:bg-red-600 text-white text-xs px-4 py-2 rounded-full font-medium transition shadow-sm">Erase</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="fixed bottom-8 right-8 z-50 bg-nordic-900 text-white text-sm px-6 py-3 rounded-full shadow-xl transition-all duration-300 transform translate-y-20 opacity-0 flex items-center space-x-3"><i id="toast-icon" class="fa-solid fa-check"></i><span id="toast-msg">Done</span></div>

  <script>
    let db = null;
    let entries = [];
    let activeTab = 'single';
    let currentSingleIndex = 0;
    let selectedWeekOffset = 0;
    let currentEditingId = null;
    let selectedMoodFilter = 0;
    let moodChartInstance = null;
    let chartRangeDays = 7;
    let mapInstance = null;

    const MOOD_CONFIG = {
      '5': { score: 5, emoji: '😄', color: '#10b981' },
      '4': { score: 4, emoji: '😊', color: '#3b82f6' },
      '3': { score: 3, emoji: '😐', color: '#6366f1' },
      '2': { score: 2, emoji: '🙁', color: '#f59e0b' },
      '1': { score: 1, emoji: '😭', color: '#f43f5e' }
    };
    function parseMoodScore(v) { const p = parseInt(v); return (p>=1&&p<=5) ? p : 3; }

    function initDB() {
      return new Promise((resolve) => {
        const req = indexedDB.open('NordicDiaryDB', 1);
        req.onupgradeneeded = e => { const r = e.target.result; if (!r.objectStoreNames.contains('entries')) { const s = r.createObjectStore('entries', { keyPath: 'id' }); s.createIndex('date', 'date', { unique: false }); s.createIndex('monthDay', 'monthDay', { unique: false }); } };
        req.onsuccess = e => { db = e.target.result; resolve(db); };
      });
    }
    async function loadAllEntries() { return new Promise(r => { const req = db.transaction('entries', 'readonly').objectStore('entries').getAll(); req.onsuccess = () => { entries = (req.result||[]).sort((a, b) => new Date(b.date) - new Date(a.date)); r(); }; }); }
    async function saveEntryToDB(obj) { return new Promise(r => { const tx = db.transaction('entries', 'readwrite'); tx.objectStore('entries').put(obj); tx.oncomplete = r; }); }
    async function deleteEntryFromDB(id) { return new Promise(r => { const tx = db.transaction('entries', 'readwrite'); tx.objectStore('entries').delete(id); tx.oncomplete = r; }); }

    window.onload = async () => {
      await initDB(); await loadAllEntries(); setupCanvasListeners();
      document.querySelectorAll('.tab-btn').forEach(btn => btn.onclick = () => { document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('border-nordic-900', 'text-nordic-900'); b.classList.add('border-transparent', 'text-nordic-300'); }); btn.classList.add('border-nordic-900', 'text-nordic-900'); btn.classList.remove('border-transparent', 'text-nordic-300'); activeTab = btn.getAttribute('data-tab'); document.querySelectorAll('.tab-content').forEach(tc => tc.classList.add('hidden')); document.getElementById(`view-${activeTab}`).classList.remove('hidden'); refreshActiveView(); });
      document.getElementById('btn-new-entry').onclick = () => openEditor(); document.getElementById('btn-close-editor').onclick = () => document.getElementById('editor-modal').classList.add('hidden'); document.getElementById('btn-save-editor').onclick = saveCurrentEditor; document.getElementById('btn-delete-entry').onclick = async () => { if(confirm('Delete this entry?')){ await deleteEntryFromDB(currentEditingId); await loadAllEntries(); refreshActiveView(); document.getElementById('editor-modal').classList.add('hidden'); showToast('Deleted'); }};
      document.getElementById('tool-select').onclick = () => setMode('select'); document.getElementById('tool-pen').onclick = () => setMode('pen'); document.getElementById('tool-eraser').onclick = () => setMode('eraser');
      document.getElementById('pen-color-picker').oninput = e => { strokeColor = e.target.value; setMode('pen'); }; document.getElementById('pen-size').oninput = e => strokeSize = parseInt(e.target.value); document.getElementById('btn-clear-canvas').onclick = () => { saveStateForUndo(); ctx.clearRect(0, 0, canvas.width, canvas.height); }; document.getElementById('btn-remove-bg').onclick = () => { bgImageSrc = null; const b=document.getElementById('canvas-bg-img'); b.src=''; b.classList.add('hidden'); }; document.getElementById('btn-undo').onclick = triggerUndo; document.getElementById('btn-redo').onclick = triggerRedo;
      document.getElementById('input-photo').onchange = e => { if(!e.target.files[0])return; const r=new FileReader(); r.onload=evt=>{ bgImageSrc=evt.target.result; const b=document.getElementById('canvas-bg-img'); b.src=bgImageSrc; b.classList.remove('hidden'); }; r.readAsDataURL(e.target.files[0]); e.target.value=''; };
      document.getElementById('btn-open-sync').onclick = () => document.getElementById('sync-modal').classList.remove('hidden'); document.getElementById('btn-close-sync').onclick = () => document.getElementById('sync-modal').classList.add('hidden');
      document.getElementById('btn-export-json').onclick = () => { const a=document.createElement('a'); a.href="data:text/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(entries)); a.download=`Journal_${new Date().toISOString().split('T')[0]}.json`; a.click(); };
      document.getElementById('input-import-json').onchange = e => { const r=new FileReader(); r.onload=async evt=>{ try{ const d=JSON.parse(evt.target.result); for(let i of d) await saveEntryToDB(i); await loadAllEntries(); refreshActiveView(); document.getElementById('sync-modal').classList.add('hidden'); showToast('Restored'); }catch{showToast('Error','error');}}; r.readAsText(e.target.files[0]); };
      document.getElementById('btn-clear-all').onclick = async () => { if(confirm("Delete ALL data? Cannot be undone.")){ await db.transaction('entries', 'readwrite').objectStore('entries').clear(); entries=[]; document.getElementById('sync-modal').classList.add('hidden'); refreshActiveView(); showToast('Erased'); }};
      renderSingleView();
    };
  </script>
</body>
</html>
